<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Rabia!</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          "Quicksand",
          system-ui,
          -apple-system,
          sans-serif;
      }
      .font-handwritten {
        font-family: "Dancing Script", cursive;
      }

      @keyframes zoomIn {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes pageIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .page-enter {
        animation: pageIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes confettiFall {
        0% {
          transform: translateY(-10vh) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(110vh) rotate(540deg);
          opacity: 0.9;
        }
      }
      .confetti-piece {
        position: fixed;
        top: -5vh;
        animation-name: confettiFall;
        animation-timing-function: cubic-bezier(0.35, 0, 0.65, 1);
        pointer-events: none;
        z-index: 60;
      }

      .flip-card-inner {
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }
      .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-card {
        perspective: 1000px;
      }
      .flip-face {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .flip-back {
        transform: rotateY(180deg);
      }

      @keyframes flicker {
        0%,
        100% {
          transform: scale(1, 1) rotate(-1deg);
        }
        25% {
          transform: scale(0.94, 1.08) rotate(1.5deg);
        }
        50% {
          transform: scale(1.05, 0.95) rotate(-1.5deg);
        }
        75% {
          transform: scale(0.96, 1.06) rotate(1deg);
        }
      }
      .flame {
        transform-origin: 200px 64px;
        animation: flicker 0.35s infinite ease-in-out;
      }
      @keyframes smokeUp {
        0% {
          transform: translateY(0) scale(0.6);
          opacity: 0.7;
        }
        100% {
          transform: translateY(-45px) scale(1.8);
          opacity: 0;
        }
      }
      .smoke {
        animation: smokeUp 1.6s ease-out forwards;
      }
      @keyframes swipeHint {
        0%,
        100% {
          transform: translateX(-30px);
          opacity: 0.3;
        }
        50% {
          transform: translateX(30px);
          opacity: 1;
        }
      }
      .swipe-hint {
        animation: swipeHint 1.4s infinite ease-in-out;
      }
      @keyframes numPop {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        60% {
          transform: scale(1.2);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .num-pop {
        animation: numPop 0.5s ease-out both;
      }

      /* ===== DARK AESTHETIC OVERRIDE ===== */
      body {
        background: #0b0614;
      }

      /* every page background */
      [class*="bg-gradient-to-br"] {
        background-image:
          radial-gradient(
            circle at 15% 10%,
            rgba(190, 24, 93, 0.35) 0%,
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 90%,
            rgba(109, 40, 217, 0.35) 0%,
            transparent 45%
          ),
          linear-gradient(160deg, #0b0614, #150a22 55%, #1f0a1a) !important;
      }

      /* white cards and buttons become dark glass */
      .bg-white {
        background-color: #1a1226 !important;
        border: 1px solid rgba(244, 114, 182, 0.35);
        box-shadow: 0 0 18px rgba(244, 114, 182, 0.15);
      }
      .bg-pink-50 {
        background-color: #2a1a3a !important;
      }
      .bg-white\/95 {
        background-color: rgba(26, 18, 38, 0.95) !important;
        border: 1px solid rgba(244, 114, 182, 0.35);
        box-shadow: 0 0 18px rgba(244, 114, 182, 0.15);
      }

      /* text inside those cards */
      .text-gray-800,
      .text-gray-700,
      .text-gray-600 {
        color: #f3e8ff !important;
      }
      .text-pink-600 {
        color: #f9a8d4 !important;
      }
      .text-pink-500 {
        color: #fb7185 !important;
      }

      /* glass panels slightly darker */
      .bg-white\/20 {
        background-color: rgba(255, 255, 255, 0.07) !important;
      }
      .bg-white\/30 {
        background-color: rgba(255, 255, 255, 0.12) !important;
      }

      /* question textareas */
      textarea {
        background: #120a1c;
        color: #fff;
        border-color: rgba(244, 114, 182, 0.5) !important;
      }
      textarea::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      /* soft glow on headings */
      h1,
      h2 {
        text-shadow: 0 0 18px rgba(244, 114, 182, 0.55);
      }
      @media (prefers-reduced-motion: reduce) {
        .page-enter,
        .confetti-piece {
          animation: none !important;
        }
      }
    </style>
  </head>

    <script type="text/babel">

      const BookHeart = ({ className }) => (
        <svg
          className={className}
          fill="none"

        >

            d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
          />
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth={1.6}
            d="M12 7.8c-.8-1-2.5-1-3 .1-.5 1 .2 1.9 3 4 2.8-2.1 3.5-3 3-4-.5-1.1-2.2-1.1-3-.1z"
          />
        </svg>
      );

      // ---- Ambient falling hearts, drawn on canvas (reliable regardless of
      // CSS animation settings or system "reduce motion" preferences) ----
      function FloatingHearts() {
        const canvasRef = useRef(null);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animationId;
          let hearts = [];

          function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
          }
          resize();
          window.addEventListener("resize", resize);

          const HEART_COLORS = [
            "#ffffff",
            "#fbcfe8",
            "#f9a8d4",
            "#fecdd3",
            "#f5d0fe",
          ];

          function drawHeart(x, y, size, color, opacity, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.globalAlpha = opacity;
            ctx.fillStyle = color;
            ctx.beginPath();
            const top = size * 0.3;
            ctx.moveTo(0, top);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, top);
            ctx.bezierCurveTo(-size / 2, size * 0.6, 0, size * 0.8, 0, size);
            ctx.bezierCurveTo(
              0,
              size * 0.8,
              size / 2,
              size * 0.6,
              size / 2,
              top,
            );
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, top);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }

          class Heart {
            constructor() {
              this.reset(true);
            }
            reset(initial = false) {
              this.x = Math.random() * canvas.width;
              this.y = initial ? Math.random() * canvas.height : -20;
              this.size = Math.random() * 10 + 10;
              this.speed = Math.random() * 0.7 + 0.4;
              this.drift = (Math.random() - 0.5) * 0.5;
              this.angle = (Math.random() - 0.5) * 0.5;
              this.spin = (Math.random() - 0.5) * 0.012;
              this.opacity = Math.random() * 0.35 + 0.3;
              this.color =
                HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
            }
            update() {
              this.y += this.speed;
              this.x += this.drift;
              this.angle += this.spin;
              if (this.y > canvas.height + 20) this.reset();
            }
            draw() {
              drawHeart(
                this.x,
                this.y,
                this.size,
                this.color,
                this.opacity,
                this.angle,
              );
            }
          }

          for (let i = 0; i < 45; i++) hearts.push(new Heart());

          const prefersReducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;

          if (prefersReducedMotion) {
            // Draw a single static frame so hearts are still visible.
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach((h) => h.draw());
          } else {
            function loop() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              hearts.forEach((h) => {
                h.update();
                h.draw();
              });
              animationId = requestAnimationFrame(loop);
            }
            loop();
          }

          return () => {
            window.removeEventListener("resize", resize);
            if (animationId) cancelAnimationFrame(animationId);
          };
        }, []);

        return (
          <canvas
            ref={canvasRef}
            className="fixed inset-0 pointer-events-none"
            style={{ zIndex: 5 }}
            aria-hidden="true"
          />
        );
      }

      // ---- Confetti burst, mounts for a few seconds then disappears ----
      function Confetti({ onDone }) {
        const pieces = useMemo(() => {
          const colors = [
            "#f472b6",
            "#c084fc",
            "#fb7185",
            "#fde68a",
            "#fca5a5",
          ];
          return Array.from({ length: 40 }).map((_, i) => ({
            id: i,
            left: Math.random() * 100,
            size: 6 + Math.random() * 8,
            duration: 2.2 + Math.random() * 1.6,
            delay: Math.random() * 0.4,
            color: colors[i % colors.length],
            radius: Math.random() > 0.5 ? "9999px" : "2px",
          }));
        }, []);

        useEffect(() => {
          const t = setTimeout(() => onDone && onDone(), 3200);
          return () => clearTimeout(t);
        }, []);

        return (
          <div
            className="fixed inset-0 overflow-hidden pointer-events-none"
            aria-hidden="true"
          >
            {pieces.map((p) => (
              <div
                key={p.id}
                className="confetti-piece"
                style={{
                  left: `${p.left}%`,
                  width: p.size,
                  height: p.size * 1.4,
                  backgroundColor: p.color,
                  borderRadius: p.radius,
                  animationDuration: `${p.duration}s`,
                  animationDelay: `${p.delay}s`,
                }}
              />
            ))}
          </div>
        );
      }

      // Tiny synthesized chime, no external audio file needed
      function playChime() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          const ctx = new Ctx();
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;
            const start = ctx.currentTime + i * 0.14;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(0.18, start + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.55);
          });
        } catch (e) {
          console.log("Audio not available", e);
        }
      }
      // ---- Background "Happy Birthday" tune (synthesized, loops) ----
      // ---- Background "Happy Birthday" music box tune (waltz, looping) ----
      const birthdayMusic = (() => {
        let ctx = null;
        let master = null;
        let reverbIn = null;
        let timer = null;
        let started = false;
        let muted = false;
        const VOLUME = 0.16;
        const BEAT = 0.52; // seconds per beat; bigger = slower

        // note frequencies
        const C3 = 130.81,
          G2 = 98.0;
        const B3 = 246.94,
          D4 = 293.66,
          E4 = 329.63,
          F4 = 349.23,
          G4 = 392.0,
          A4 = 440.0,
          B4 = 493.88,
          C5 = 523.25,
          D5 = 587.33,
          E5 = 659.25,
          F5 = 698.46,
          G5 = 783.99;

        // Melody: [frequency, beats]; 0 = rest. Written in 3/4 time.
        const melody = [
          [0, 2],
          [G4, 0.75],
          [G4, 0.25],
          [A4, 1],
          [G4, 1],
          [C5, 1],
          [B4, 2],
          [G4, 0.75],
          [G4, 0.25],
          [A4, 1],
          [G4, 1],
          [D5, 1],
          [C5, 2],
          [G4, 0.75],
          [G4, 0.25],
          [G5, 1],
          [E5, 1],
          [C5, 1],
          [B4, 1],
          [A4, 1],
          [F5, 0.75],
          [F5, 0.25],
          [E5, 1],
          [C5, 1],
          [D5, 1],
          [C5, 3],
          [0, 3],
        ];

        // Accompaniment per bar (9 bars): bass note + 2 chord notes
        const C = { bass: C3, chord: [E4, G4] };
        const G7 = { bass: G2, chord: [B3, D4, F4] };
        const bars = [C, C, G7, G7, C, C, G7, C, C];

        const total = 9 * 3 * BEAT;

        function makeReverb() {
          const len = ctx.sampleRate * 2.2;
          const buf = ctx.createBuffer(2, len, ctx.sampleRate);
          for (let c = 0; c < 2; c++) {
            const d = buf.getChannelData(c);
            for (let i = 0; i < len; i++) {
              d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
            }
          }
          const conv = ctx.createConvolver();
          conv.buffer = buf;
          const wet = ctx.createGain();
          wet.gain.value = 0.45;
          reverbIn = ctx.createGain();
          reverbIn.connect(conv);
          conv.connect(wet);
          wet.connect(master);
        }

        // One music-box / celesta style note
        function bell(freq, t, dur, vol) {
          const partials = [
            [1, 1.0, 1.0],
            [2, 0.35, 0.6],
            [3, 0.12, 0.35],
            [4.2, 0.06, 0.2],
          ];
          const out = ctx.createGain();
          out.connect(master);
          out.connect(reverbIn);
          partials.forEach(([mult, amp, decayMult]) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq * mult;
            const len = Math.max(dur * 1.6, 0.9) * decayMult;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol * amp, t + 0.008);
            g.gain.exponentialRampToValueAtTime(0.0001, t + len);
            osc.connect(g);
            g.connect(out);
            osc.start(t);
            osc.stop(t + len + 0.05);
          });
        }

        // Soft warm pad note for accompaniment
        function soft(freq, t, dur, vol) {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(vol, t + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(g);
          g.connect(master);
          g.connect(reverbIn);
          osc.start(t);
          osc.stop(t + dur + 0.05);
        }

        function scheduleLoop(startAt) {
          // melody
          let t = startAt;
          melody.forEach(([freq, beats]) => {
            const dur = beats * BEAT;
            if (freq) bell(freq, t, dur, 0.55);
            t += dur;
          });
          // waltz accompaniment
          bars.forEach((b, i) => {
            const barStart = startAt + i * 3 * BEAT;
            soft(b.bass, barStart, BEAT * 2.6, 0.22);
            [1, 2].forEach((beat) => {
              const bt = barStart + beat * BEAT;
              b.chord.forEach((f) => soft(f, bt, BEAT * 0.9, 0.07));
            });
          });

          const nextStart = startAt + total;
          timer = setTimeout(
            () => scheduleLoop(nextStart),
            Math.max((nextStart - ctx.currentTime - 1) * 1000, 100),
          );
        }

        document.addEventListener("visibilitychange", () => {
          if (!ctx || !started) return;
          if (document.hidden) ctx.suspend();
          else ctx.resume();
        });

        return {
          start() {
            if (started) return;
            try {
              const AC = window.AudioContext || window.webkitAudioContext;
              ctx = new AC();
              master = ctx.createGain();
              master.gain.value = muted ? 0 : VOLUME;
              master.connect(ctx.destination);
              makeReverb();
              started = true;
              scheduleLoop(ctx.currentTime + 0.2);
            } catch (e) {
              console.log("Audio not available", e);
            }
          },
          unlock() {
            if (!started) {
              this.start();
              return;
            }
            if (ctx && ctx.state === "suspended" && !document.hidden)
              ctx.resume();
          },
          toggleMute() {
            muted = !muted;
            if (master) master.gain.value = muted ? 0 : VOLUME;
            return muted;
          },
        };
      })();
      // iOS Safari refuses to play audio created before any real tap, even
      // if you "resume" it later — so we only create/start the AudioContext
      // on the very first genuine user gesture, never before.
      ["pointerdown", "touchstart", "click", "keydown"].forEach((ev) =>
        window.addEventListener(ev, () => birthdayMusic.unlock(), {
          passive: true,
        }),
      );

      function daysSince(dateStr) {
        const start = new Date(dateStr + "T00:00:00");
        const now = new Date();
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        return Math.max(diff, 0);
      }

      // ---- Cake screen: countdown -> blow candle -> swipe to cut ----
      function CakeLayer({ x, y, w, h, id, frost }) {
        const rx = w / 2;
        const cx = x + rx;
        const ry = 14;
        const dripPositions = [0.1, 0.27, 0.45, 0.63, 0.8, 0.92];
        return (
          <g>
            {/* body */}
            <path
              d={`M${x},${y} L${x},${y + h} A${rx},${ry} 0 0 0 ${x + w},${y + h} L${x + w},${y} Z`}
              fill={`url(#sponge-${id})`}
            />
            {/* cylinder shading */}
            <path
              d={`M${x},${y} L${x},${y + h} A${rx},${ry} 0 0 0 ${x + w},${y + h} L${x + w},${y} Z`}
              fill="url(#shade)"
            />
            {/* frosting drips */}
            {dripPositions.map((p, i) => {
              const px = x + w * p;
              const dx = (px - cx) / rx;
              const edgeY = y + ry * Math.sqrt(Math.max(0, 1 - dx * dx));
              const len = 14 + (i % 3) * 9;
              return (
                <rect
                  key={i}
                  x={px - 6}
                  y={edgeY - 4}
                  width={12}
                  height={len}
                  rx={6}
                  fill={frost}
                />
              );
            })}
            {/* top frosting */}
            <ellipse cx={cx} cy={y} rx={rx} ry={ry} fill={frost} />
            <ellipse
              cx={cx}
              cy={y}
              rx={rx - 8}
              ry={ry - 4}
              fill="white"
              opacity="0.35"
            />
          </g>
        );
      }

      function CakeScreen({ onDone }) {
        const [phase, setPhase] = useState("countdown"); // countdown | blown | cut | done
        const [count, setCount] = useState(3);
        const [cutDone, setCutDone] = useState(false);
        const [trail, setTrail] = useState([]);
        const boxRef = useRef(null);
        const dragging = useRef(false);

        // 3,2,1 countdown
        useEffect(() => {
          if (phase !== "countdown") return;
          if (count === 0) {
            setPhase("blown");
            return;
          }
          const t = setTimeout(() => setCount((c) => c - 1), 1000);
          return () => clearTimeout(t);
        }, [count, phase]);

        // after blowing, switch to swipe-to-cut
        useEffect(() => {
          if (phase !== "blown") return;
          const t = setTimeout(() => setPhase("cut"), 1600);
          return () => clearTimeout(t);
        }, [phase]);

        const getPt = (e) => {
          const r = boxRef.current.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        const doCut = () => {
          setCutDone(true);
          setPhase("done");
          setTrail([]);
          playChime();
          setTimeout(() => onDone && onDone(), 3000);
        };

        const onDown = (e) => {
          if (phase !== "cut") return;
          dragging.current = true;
          e.currentTarget.setPointerCapture(e.pointerId);
          setTrail([getPt(e)]);
        };
        const onMove = (e) => {
          if (!dragging.current) return;
          setTrail((t) => [...t, getPt(e)]);
        };
        const onUp = () => {
          if (!dragging.current) return;
          dragging.current = false;
          if (trail.length > 1) {
            const a = trail[0];
            const b = trail[trail.length - 1];
            if (Math.hypot(b.x - a.x, b.y - a.y) > 100) {
              doCut();
              return;
            }
          }
          setTrail([]);
        };

        const cake = (
          <g>
            <CakeLayer
              id="bottom"
              x={50}
              y={250}
              w={300}
              h={80}
              frost="#fbcfe8"
            />
            <CakeLayer id="mid" x={95} y={175} w={210} h={78} frost="#ffffff" />
            <CakeLayer
              id="top"
              x={140}
              y={105}
              w={120}
              h={73}
              frost="#fff1f5"

            {/* cherries */}
            <circle cx={165} cy={100} r={7} fill="#e11d48" />
            <circle cx={163} cy={97} r={2} fill="white" opacity="0.6" />
            <circle cx={235} cy={100} r={7} fill="#e11d48" />
            <circle cx={233} cy={97} r={2} fill="white" opacity="0.6" />

        const half = (side) => (

            style={{
              transformOrigin: "200px 340px",
              transition: "transform 1s cubic-bezier(0.22, 1, 0.36, 1)",
              transform: cutDone
                ? side === "L"
                  ? "translateX(-30px) rotate(-3deg)"
                  : "translateX(30px) rotate(3deg)"
                : "none",
            }}
          >
            {cake}
          </g>
        );

        const showCandle = phase !== "done";
        const flameOn = phase === "countdown";

        return (
          <div className="min-h-screen bg-gradient-to-br from-pink-400 via-purple-400 to-pink-500 flex flex-col items-center justify-center p-4 page-enter">
            {phase === "done" && <Confetti onDone={() => {}} />}

            <h2 className="text-3xl sm:text-4xl font-bold text-white font-handwritten mb-2 relative z-10 text-center">
              {phase === "done"
                ? "Happy Birthday Rabia! 🎂"

            </h2>

            <div
              ref={boxRef}
              className="relative w-full max-w-md select-none z-10"
              style={{
                touchAction: "none",
                cursor: phase === "cut" ? "grab" : "default",
              }}
              onPointerDown={onDown}
              onPointerMove={onMove}
              onPointerUp={onUp}
              onPointerCancel={onUp}
            >
              <svg viewBox="0 0 400 380" className="w-full h-auto">
                <defs>
                  {[
                    ["bottom", "#8a5232", "#5a3320"],
                    ["mid", "#fde7c8", "#efc994"],
                    ["top", "#f9a8c0", "#e97ba0"],
                  ].map(([id, c1, c2]) => (
                    <linearGradient
                      key={id}
                      id={`sponge-${id}`}
                      x1="0"
                      x2="0"
                      y1="0"
                      y2="1"
                    >
                      <stop offset="0%" stopColor={c1} />
                      <stop offset="100%" stopColor={c2} />
                    </linearGradient>
                  ))}
                  <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
                    <stop offset="0%" stopColor="#000" stopOpacity="0.22" />
                    <stop offset="30%" stopColor="#fff" stopOpacity="0.12" />
                    <stop offset="60%" stopColor="#000" stopOpacity="0" />
                    <stop offset="100%" stopColor="#000" stopOpacity="0.28" />
                  </linearGradient>
                  <linearGradient id="candle" x1="0" x2="1">
                    <stop offset="0%" stopColor="#fde68a" />
                    <stop offset="50%" stopColor="#fff" />
                    <stop offset="100%" stopColor="#f9a8d4" />
                  </linearGradient>
                  <radialGradient id="glow">
                    <stop offset="0%" stopColor="#fde68a" stopOpacity="0.8" />
                    <stop offset="100%" stopColor="#fde68a" stopOpacity="0" />
                  </radialGradient>
                  <radialGradient id="plateShade">
                    <stop offset="0%" stopColor="#fff" stopOpacity="0.95" />
                    <stop offset="100%" stopColor="#e9d5ff" stopOpacity="0.9" />
                  </radialGradient>
                  <clipPath id="clipL">
                    <rect x="0" y="0" width="200.5" height="400" />
                  </clipPath>
                  <clipPath id="clipR">
                    <rect x="199.5" y="0" width="201" height="400" />
                  </clipPath>
                </defs>

                {/* plate + shadow */}
                <ellipse
                  cx="200"
                  cy="345"
                  rx="185"

                {half("L")}

                {/* candle */}
                {showCandle && (
                  <g>
                    <rect
                      x="195"

                      width="10"
                      height="40"
                      rx="2"
                      fill="url(#candle)"
                    />
                    <path
                      d="M195 78 L205 74 M195 88 L205 84 M195 98 L205 94"
                      stroke="#f472b6"
                      strokeWidth="2"
                    />
                    <line
                      x1="200"
                      y1="68"
                      x2="200"
                      y2="62"
                      stroke="#333"
                      strokeWidth="1.5"
                    />
                    {flameOn && (
                      <g>
                        <circle cx="200" cy="52" r="28" fill="url(#glow)" />
                        <g className="flame">
                          <path
                            d="M200 34 C211 47 213 58 200 65 C187 58 189 47 200 34 Z"
                            fill="#fb923c"
                          />
                          <path
                            d="M200 44 C206 52 206 58 200 63 C194 58 194 52 200 44 Z"
                            fill="#fde047"
                          />
                        </g>
                      </g>
                    )}
                    {phase === "blown" && (
                      <g>
                        <circle
                          className="smoke"
                          cx="200"
                          cy="58"
                          r="5"
                          fill="#9ca3af"
                        />
                        <circle
                          className="smoke"
                          cx="204"
                          cy="56"
                          r="4"
                          fill="#9ca3af"

              </svg>

              {/* knife trail */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none">

                resolve(value);

                    <h3 className="text-white font-semibold text-lg sm:text-xl">
                      Photo Gallery
                    </h3>
                    <p className="text-white/80 text-sm mt-2">
                      Some Glimpse of Your Life
                    </p>
                  </button>

                  <button
                    onClick={() => setCurrentPage("story")}
                    className="bg-white/20 backdrop-blur-md p-6 sm:p-8 rounded-3xl border-2 border-white/40 hover:bg-white/30 transition-all transform hover:scale-105"
                  >
                    <BookHeart className="w-10 h-10 sm:w-12 sm:h-12 text-white mx-auto mb-3" />
                    <h3 className="text-white font-semibold text-lg sm:text-xl">
                      Our Story
                    </h3>
                    <p className="text-white/80 text-sm mt-2">
                      How it all began
                    </p>
                  </button>

                  <button
                    onClick={() => setCurrentPage("reasons")}
                    className="bg-white/20 backdrop-blur-md p-6 sm:p-8 rounded-3xl border-2 border-white/40 hover:bg-white/30 transition-all transform hover:scale-105"
                  >
                    <Heart className="w-10 h-10 sm:w-12 sm:h-12 text-white mx-auto mb-3" />
                    <h3 className="text-white font-semibold text-lg sm:text-xl">
                      Reasons I Love You
                    </h3>
                    <p className="text-white/80 text-center mb-2 text-sm sm:text-base">
                      Tap a card to reveal one
                    </p>
                  </button>

                  <button
                    onClick={() => setCurrentPage("questions")}
                    className="bg-white/20 backdrop-blur-md p-6 sm:p-8 rounded-3xl border-2 border-white/40 hover:bg-white/30 transition-all transform hover:scale-105"
                  >
                    <Send className="w-10 h-10 sm:w-12 sm:h-12 text-white mx-auto mb-3" />
                    <h3 className="text-white font-semibold text-lg sm:text-xl">
                      Q&A Time
                    </h3>
                    <p className="text-white/80 text-sm mt-2">
                      Answer some fun questions
                    </p>
                  </button>

                  <button
                    onClick={() => setCurrentPage("closing")}
                    className="bg-white/20 backdrop-blur-md p-6 sm:p-8 rounded-3xl border-2 border-white/40 hover:bg-white/30 transition-all transform hover:scale-105"
                  >
                    <Gift className="w-10 h-10 sm:w-12 sm:h-12 text-white mx-auto mb-3" />
                    <h3 className="text-white font-semibold text-lg sm:text-xl">
                      Closing Note
                    </h3>
                    <p className="text-white/80 text-sm mt-2">
                      A little something before you go
                    </p>
                  </button>
                </div>
              </div>
            </div>
          );
        } else if (currentPage === "message") {
          pageContent = (
            <div className="min-h-screen bg-gradient-to-br from-pink-400 via-red-400 to-orange-400 flex items-center justify-center p-4 page-enter">
              <div className="max-w-2xl w-full bg-white/20 backdrop-blur-md rounded-3xl p-6 sm:p-8 border border-white/30 relative z-10">
                <h2 className="text-3xl sm:text-4xl font-bold text-white text-center mb-6">
                  A Special Message For You 💌
                </h2>

                <div className="bg-white rounded-2xl p-6 sm:p-8 space-y-4 text-gray-800">
                  <p className="text-base sm:text-lg leading-relaxed">
                    My Dearest,
                  </p>
                  <p className="text-base sm:text-lg leading-relaxed">
                    Happy Birthday to the most incredible person I know! 🎉
                    Every moment with you is a treasure, and I feel so lucky to
                    meet you in my life.
                  </p>
                  <p className="text-base sm:text-lg leading-relaxed">
                    You bring so much joy, laughter, and love into my world.
                    Your smile lights up my darkest days, and your kindness
                    inspires me to be a better person.
                  </p>
                  <p className="text-base sm:text-lg leading-relaxed">
                    Today, I celebrate You, everything you are, everything
                    you've accomplished, and everything you will become. May
                    this year bring you endless happiness, success, and all your
                    dreams come true! ✨
                  </p>
                  <p className="text-base sm:text-lg leading-relaxed">
                    I love you more than words can express! ❤️
                  </p>
                  <p className="text-base sm:text-lg leading-relaxed font-handwritten">
                    Forever yours,
                    <br />
                    Akif
                  </p>
                </div>

                <button
                  onClick={() => setCurrentPage("menu")}
                  className="mt-6 bg-white text-pink-600 px-6 py-3 rounded-full font-semibold hover:bg-pink-50 transition-all w-full"
                >
                  Back to Menu
                </button>
              </div>
            </div>
          );
        } else if (currentPage === "photos") {
          pageContent = (
            <div className="min-h-screen bg-gradient-to-br from-purple-400 via-pink-400 to-blue-400 p-4 page-enter">
              <div className="max-w-6xl mx-auto py-8 relative z-10">
                <h2 className="text-3xl sm:text-4xl font-bold text-white text-center mb-8">
                  Your Beautiful Memories 📸
                </h2>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 mb-8">
                  {photos.map((photo) => (
                    <div
                      key={photo.id}
                      onClick={() => setSelectedPhoto(photo)}
                      className="bg-white rounded-2xl overflow-hidden cursor-pointer transform hover:scale-105 transition-all shadow-xl"
                    >
                      <div className="bg-gradient-to-br from-pink-300 to-purple-300 rounded-2xl overflow-hidden">
                        {photo.url ? (
                          <img
                            src={photo.url}
                            alt={photo.caption}
                            className="w-full aspect-[3/4] object-cover"
                          />
                        ) : (
                          <div className="flex items-center justify-center h-64">
                            <Camera className="w-16 h-16 text-white/50" />
                          </div>
                        )}
                      </div>

                      <div className="p-4">
                        <p className="text-gray-700 text-center text-sm sm:text-base font-handwritten">
                          {photo.caption}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => setCurrentPage("menu")}
                  className="bg-white text-pink-600 px-6 py-3 rounded-full font-semibold hover:bg-pink-50 transition-all mx-auto block"
                >
                  Back to Menu
                </button>

                {selectedPhoto && (
                  <div
                    onClick={() => setSelectedPhoto(null)}
                    className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity duration-500"
                  >
                    <div
                      className="relative max-w-2xl w-full max-h-[90vh] bg-white rounded-3xl p-4 sm:p-6 overflow-hidden
        animate-[zoomIn_0.4s_ease-out]"
                    >
                      <div className="relative w-full h-full flex flex-col">
                        <div className="flex-1 flex items-center justify-center mb-4 overflow-hidden rounded-2xl">
                          {selectedPhoto.url ? (
                            <img
                              src={selectedPhoto.url}
                              alt={selectedPhoto.caption}
                              className="w-full h-full max-h-[80vh] object-contain"
                              onClick={(e) => e.stopPropagation()}
                            />
                          ) : (
                            <Camera className="w-24 h-24 text-gray-300" />
                          )}
                        </div>
                        <p className="text-gray-700 text-center text-sm sm:text-base font-handwritten">
                          {selectedPhoto.caption}
                        </p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        } else if (currentPage === "story") {
          pageContent = (
            <div className="min-h-screen bg-gradient-to-br from-rose-400 via-pink-400 to-purple-500 p-4 page-enter">
              <div className="max-w-2xl mx-auto py-8 relative z-10">
                <h2 className="text-3xl sm:text-4xl font-bold text-white text-center mb-2">
                  Our Story 📖
                </h2>
                <p className="text-white/80 text-center mb-10 text-sm sm:text-base">
                  A few moments that mean everything to me
                </p>

                <div className="relative pl-8 sm:pl-10">
                  <div className="absolute left-3 sm:left-4 top-2 bottom-2 w-0.5 bg-white/40" />

                  {storyMoments.map((moment, idx) => (
                    <div key={moment.id} className="relative mb-10 last:mb-0">
                      <div className="absolute -left-8 sm:-left-10 top-1 w-6 h-6 rounded-full bg-white flex items-center justify-center shadow-lg">
                        <Heart className="w-3.5 h-3.5 text-pink-500" />
                      </div>
                      <div className="bg-white/95 rounded-2xl p-5 sm:p-6 shadow-xl">
                        <p className="text-pink-500 font-semibold text-xs sm:text-sm mb-1 tracking-wide">
                          {moment.date}
                        </p>
                        <h3 className="text-gray-800 font-bold text-lg sm:text-xl mb-2 font-handwritten">
                          {moment.title}
                        </h3>
                        <p className="text-gray-600 text-sm sm:text-base leading-relaxed">
                          {moment.text}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => setCurrentPage("menu")}
                  className="mt-4 bg-white text-pink-600 px-6 py-3 rounded-full font-semibold hover:bg-pink-50 transition-all mx-auto block"
                >
                  Back to Menu
                </button>
              </div>
            </div>
          );
        } else if (currentPage === "reasons") {
          pageContent = (
            <div className="min-h-screen bg-gradient-to-br from-purple-400 via-pink-400 to-rose-400 p-4 page-enter">
              <div className="max-w-4xl mx-auto py-8 relative z-10">
                <h2 className="text-3xl sm:text-4xl font-bold text-white text-center mb-2">
                  Reasons I Love You 💗
                </h2>
                <p className="text-white/80 text-center mb-10 text-sm sm:text-base">
                  Tap a card to reveal one
                </p>
                <p className="text-white/70 text-center mb-10 font-handwritten text-lg sm:text-xl">
                  I could only fit 6 here. There are infinite reasons to love
                  you.
                </p>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-6">
                  {reasons.map((reason, idx) => {
                    const isFlipped = !!flippedCards[idx];
                    return (
                      <div
                        key={idx}
                        className={`flip-card cursor-pointer h-40 sm:h-48 ${isFlipped ? "flipped" : ""}`}
                        onClick={() => toggleFlip(idx)}
                      >
                        <div className="flip-card-inner relative w-full h-full">
                          <div className="flip-face absolute inset-0 bg-white/20 backdrop-blur-md border-2 border-white/40 rounded-2xl flex flex-col items-center justify-center gap-2">
                            <Heart className="w-8 h-8 sm:w-10 sm:h-10 text-white" />
                            <p className="text-white/90 text-xs sm:text-sm font-semibold">
                              Reason #{idx + 1}
                            </p>
                          </div>
                          <div className="flip-face flip-back absolute inset-0 bg-white rounded-2xl flex items-center justify-center p-4">
                            <p className="text-gray-700 text-center text-xs sm:text-sm leading-relaxed font-medium">
                              {reason}
                            </p>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <button
                  onClick={() => setCurrentPage("menu")}
                  className="mt-10 bg-white text-pink-600 px-6 py-3 rounded-full font-semibold hover:bg-pink-50 transition-all mx-auto block"
                >
                  Back to Menu
                </button>
              </div>
            </div>
          );
        } else if (currentPage === "questions") {
          pageContent = (
            <div className="min-h-screen bg-gradient-to-br from-blue-400 via-purple-400 to-pink-400 flex items-center justify-center p-4 page-enter">
              <div className="max-w-2xl w-full bg-white/20 backdrop-blur-md rounded-3xl p-6 sm:p-8 border border-white/30 relative z-10">
                <h2 className="text-3xl sm:text-4xl font-bold text-white text-center mb-3">
                  Let's Get to Know Your Feelings 💭
                </h2>

                {!showAnswers ? (
                  <div className="space-y-4 sm:space-y-6">
                    <p className="text-white/85 text-xs sm:text-sm text-center bg-white/10 rounded-xl p-3 border border-white/20">
                      Heads up: I'll be able to read your answers after you
                      submit them 💌 Answer as honestly or as playfully as you
                      like.
                    </p>

                    {questions.map((q) => (
                      <div
                        key={q.id}
                        className="bg-white rounded-2xl p-4 sm:p-6"
                      >
                        <label className="block text-gray-800 font-semibold mb-3 text-base sm:text-lg">
                          {q.question}
                        </label>
                        <textarea
                          value={answers[q.id]}
                          onChange={(e) =>
                            handleAnswerChange(q.id, e.target.value)
                          }
                          className="w-full p-3 sm:p-4 border-2 border-pink-300 rounded-xl focus:outline-none focus:border-pink-500 resize-none text-sm sm:text-base"
                          rows="3"
                          placeholder="Type your answer here..."
                        />
                      </div>
                    ))}

                    <div className="flex flex-col sm:flex-row gap-4">
                      <button
                        onClick={handleSubmit}
                        disabled={loading}
                        className="flex-1 bg-white text-pink-600 px-6 py-3 sm:py-4 rounded-full font-semibold text-base sm:text-lg hover:bg-pink-50 transition-all disabled:opacity-50"
                      >
                        {loading ? "Saving..." : "Submit Answers 💝"}
                      </button>
                      <button
                        onClick={() => setCurrentPage("menu")}
                        className="bg-white/30 text-white px-6 py-3 sm:py-4 rounded-full font-semibold hover:bg-white/40 transition-all"
                      >
                        Back
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-white rounded-2xl p-6 text-center">
                      <h3 className="text-xl sm:text-2xl font-bold text-pink-600 mb-4">
                        Thank You! ❤️
                      </h3>
                      <p className="text-gray-600 text-sm sm:text-base">
                        Your answers have been saved! Akif can see them anytime
                        now 😊
                      </p>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-4">
                      <button
                        onClick={() => {
                          setShowAnswers(false);
                          setAnswers({
                            q1: "",
                            q2: "",
                            q3: "",
                            q4: "",
                            q5: "",
                            q6: "",
                            q7: "",
                            q8: "",
                            q9: "",
                            q10: "",
                          });
                        }}
                        className="flex-1 bg-white text-pink-600 px-6 py-3 sm:py-4 rounded-full font-semibold hover:bg-pink-50 transition-all"
                      >
                        Answer Again
                      </button>
                      <button
                        onClick={() => setCurrentPage("menu")}
                        className="bg-white/30 text-white px-6 py-3 sm:py-4 rounded-full font-semibold hover:bg-white/40 transition-all"
                      >
                        Back to Menu
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        } else if (currentPage === "view-answers") {
          pageContent = (
            <div className="min-h-screen bg-gradient-to-br from-indigo-400 via-purple-400 to-pink-400 flex items-center justify-center p-4 page-enter">
              <div className="max-w-3xl w-full bg-white/20 backdrop-blur-md rounded-3xl p-8 border border-white/30 relative z-10">
                <h2 className="text-4xl font-bold text-white text-center mb-6">
                  Her Answers 💕
                </h2>

                {savedAnswers && savedAnswers.length > 0 ? (
                  <div className="space-y-6">
                    {savedAnswers.map((entry) => (
                      <div key={entry.id} className="bg-white rounded-2xl p-6">
                        <p className="text-gray-600 text-sm mb-4">
                          Submitted on:{" "}
                          {new Date(entry.timestamp).toLocaleString()}
                        </p>

                        {questions.map((q) => (
                          <div key={q.id} className="mb-3">
                            <p className="text-gray-800 font-semibold">
                              {q.question}
                            </p>
                            <p className="text-gray-600 bg-pink-50 p-3 rounded-xl">
                              {entry.answers[q.id] || "No answer provided"}
                            </p>
                          </div>
                        ))}
                      </div>
                    ))}

                    <button
                      onClick={async () => {
                        if (
                          !window.confirm(
                            "Are you sure you want to delete all answers? This cannot be undone!",
                          )
                        )
                          return;

                        try {
                          const snapshot = await window.firebaseApp.getDocs(
                            window.firebaseApp.collection(
                              window.firebaseApp.db,
                              "birthday-answers",
                            ),
                          );

                          for (const d of snapshot.docs) {
                            await window.firebaseApp.deleteDoc(
                              window.firebaseApp.doc(
                                window.firebaseApp.db,
                                "birthday-answers",
                                d.id,
                              ),
                            );
                          }

                          setSavedAnswers([]);
                          alert("All answers deleted successfully!");
                        } catch (error) {
                          console.error("Error deleting answers:", error);
                          alert("Error deleting answers");
                        }
                      }}
                      className="bg-red-500 text-white px-6 py-4 rounded-full font-semibold hover:bg-red-600 transition-all w-full mb-4"
                    >
                      Delete All Answers 🗑️
                    </button>

                    <button
                      onClick={() => setCurrentPage("menu")}
                      className="bg-white text-pink-600 px-6 py-4 rounded-full font-semibold hover:bg-pink-50 transition-all w-full"
                    >
                      Back to Menu
                    </button>
                  </div>
                ) : (
                  <div className="bg-white rounded-2xl p-6 text-center">
                    <p className="text-gray-600">No answers saved yet!</p>
                    <button
                      onClick={() => setCurrentPage("menu")}
                      className="mt-4 bg-white text-pink-600 px-6 py-4 rounded-full font-semibold hover:bg-pink-50 transition-all w-full"
                    >
                      Back to Menu
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        } else if (currentPage === "closing") {
          pageContent = (
            <div className="min-h-screen bg-gradient-to-br from-rose-400 via-pink-400 to-purple-500 flex items-center justify-center p-4 page-enter">
              <div className="max-w-xl w-full text-center space-y-8 bg-white/20 backdrop-blur-md rounded-3xl p-8 border border-white/30 shadow-[0_30px_80px_rgba(0,0,0,0.25)] relative z-10">
                <Heart className="w-16 h-16 text-white mx-auto animate-pulse" />

                <h2 className="text-3xl sm:text-4xl font-bold text-white font-handwritten">
                  One Last Thing…
                </h2>

                <p className="text-white/90 text-base sm:text-lg leading-relaxed">
                  No matter where life takes us,
                  <br />
                  this little corner of the internet
                  <br />
                  will always belong to you.
                </p>

                <p className="text-white/80 text-sm sm:text-base font-handwritten">
                  Made with love, just for you.
                </p>

                <button
                  onClick={() => setCurrentPage("welcome")}
                  className="bg-white text-pink-600 px-8 py-4 rounded-full font-semibold text-lg hover:bg-pink-50 transition-all transform hover:scale-105 shadow-xl"
                >
                  Come back anytime ❤️
                </button>
              </div>
            </div>
          );
        }

        return (
          <React.Fragment>
            <FloatingHearts />
            {showConfetti && <Confetti onDone={() => setShowConfetti(false)} />}
            {currentPage !== "welcome" && (
              <button
                onClick={() => setMusicMuted(birthdayMusic.toggleMute())}
                className="fixed top-4 right-4 w-11 h-11 rounded-full bg-white/30 backdrop-blur-md border border-white/40 text-white text-xl flex items-center justify-center"
                style={{ zIndex: 70 }}
                aria-label="Toggle music"
              >
                {musicMuted ? "🔇" : "🔊"}
              </button>
            )}
            {pageContent}
          </React.Fragment>
        );
      }

      ReactDOM.render(<BirthdaySurprise />, document.getElementById("root"));
    </script>
  </body>
</html>
